name: wedding_planner
description: A Flutter mobile wedding planner app connecting to a Laravel backend API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # HTTP Client
  dio: ^5.4.0

  # Navigation
  go_router: ^13.0.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Network Monitoring
  connectivity_plus: ^5.0.2

  # JSON Serialization
  json_annotation: ^4.8.1

  # Environment Configuration
  flutter_dotenv: ^5.1.0

  # Date/Number Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF69B4"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/
